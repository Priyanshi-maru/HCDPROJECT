<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Attendance | Monitoring</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-1: #0a0f1c;
            --bg-2: #121b2f;
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.6);
            --secondary: #0ea5e9;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, var(--bg-2), var(--bg-1));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Abstract Background Elements */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.3;
            border-radius: 50%;
            z-index: -1;
        }
        .glow-orb.top { top: -100px; left: -100px; }
        .glow-orb.bottom { bottom: -100px; right: -100px; background: var(--secondary); opacity: 0.2; }

        .dashboard-wrapper {
            width: 90%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            position: relative;
            z-index: 10;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        h1, h2 { font-weight: 600; letter-spacing: -0.5px; }

        /* Admin Sidebar */
        .admin-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .admin-header svg { width: 24px; height: 24px; color: var(--primary); }
        .admin-header h2 { font-size: 1.4rem; }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: auto;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 20px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px var(--primary-glow);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
            display: none;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(239, 68, 68, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Main Content */
        .main-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .main-header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .main-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .status-widget {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            transition: all 0.4s ease;
            position: relative;
        }
        .status-widget.active {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .status-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            position: relative;
            transition: all 0.4s ease;
        }
        .status-ring svg { width: 50px; height: 50px; color: var(--text-muted); transition: color 0.4s ease; }
        
        .status-widget.active .status-ring {
            border-color: var(--success);
            box-shadow: 0 0 30px var(--success-glow);
        }
        .status-widget.active .status-ring svg { color: var(--success); }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--success);
            opacity: 0;
        }
        .status-widget.active .pulse-ring {
            animation: radarPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes radarPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .status-text {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .status-subtext {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Logs Console */
        .console {
            margin-top: 30px;
            background: #050811;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .console-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--glass-border);
        }
        .console-header span.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        
        .console-body {
            padding: 15px 20px;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #a8b2d1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .console-body::-webkit-scrollbar { width: 6px; }
        .console-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        
        .log { display: flex; gap: 10px; opacity: 0; animation: fadeIn 0.3s forwards; }
        .log .time { color: var(--primary); }
        .log.highlight { color: var(--success); }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Hidden media */
        #hiddenCamera, #hiddenCanvas { display: none; }
        
        @media (max-width: 900px) {
            .dashboard-wrapper { grid-template-columns: 1fr; }
            .container { height: auto; padding: 20px 0; }
        }
    </style>
</head>
<body>

    <div class="glow-orb top"></div>
    <div class="glow-orb bottom"></div>

    <div class="dashboard-wrapper">
        
        <!-- Admin Panel -->
        <div class="glass-panel">
            <div class="admin-header">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <h2>Admin Setup</h2>
            </div>

            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" id="adminUser" placeholder="Enter username" value="" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="Enter password" value="">
            </div>

            <div style="height: 1px; background: var(--glass-border); margin: 10px 0 25px 0;"></div>

            <div class="input-group">
                <label>Total Duration (Hours)</label>
                <input type="number" id="totalTime" placeholder="e.g., 1" value="1" min="1">
            </div>
            <div class="input-group">
                <label>Capture Interval (Minutes)</label>
                <input type="number" id="intervalTime" placeholder="e.g., 10" value="10" min="1">
            </div>

            <button class="btn btn-primary" id="startBtn">Start Monitoring</button>
            <button class="btn btn-danger" id="stopBtn">Stop Monitoring</button>
        </div>

        <!-- Main Dashboard -->
        <div class="glass-panel">
            <div class="main-header">
                <h1>Smart Attendance System</h1>
                <p>Automated background capturing & processing</p>
            </div>

            <div class="status-widget" id="statusWidget">
                <div class="status-ring">
                    <div class="pulse-ring"></div>
                    <!-- Camera Icon -->
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <div class="status-text" id="statusText">System Idle</div>
                <div class="status-subtext" id="statusSubtext">Waiting for admin to initiate sequence</div>
            </div>

            <div class="console">
                <div class="console-header">
                    <span class="dot" id="consoleDot" style="background: var(--text-muted);"></span>
                    System Logs
                </div>
                <div class="console-body" id="consoleBody">
                    <div class="log"><span class="time">[INIT]</span> Dashboard loaded. Core systems online.</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden Video & Canvas for processing -->
    <video id="hiddenCamera" autoplay playsinline></video>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        const DOM = {
            adminUser: document.getElementById('adminUser'),
            adminPass: document.getElementById('adminPass'),
            totalTime: document.getElementById('totalTime'),
            intervalTime: document.getElementById('intervalTime'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            statusWidget: document.getElementById('statusWidget'),
            statusText: document.getElementById('statusText'),
            statusSubtext: document.getElementById('statusSubtext'),
            consoleBody: document.getElementById('consoleBody'),
            consoleDot: document.getElementById('consoleDot'),
            video: document.getElementById('hiddenCamera'),
            canvas: document.getElementById('hiddenCanvas')
        };

        let state = {
            stream: null,
            isMonitoring: false,
            mainInterval: null,
            totalTimeout: null,
            imagesCaptured: 0
        };

        function addLog(msg, type = 'normal') {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const div = document.createElement('div');
            div.className = `log ${type === 'success' ? 'highlight' : ''}`;
            div.innerHTML = `<span class="time">[${timeStr}]</span> ${msg}`;
            DOM.consoleBody.prepend(div);
        }

        async function initCamera() {
            if (!state.stream) {
                try {
                    state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    DOM.video.srcObject = state.stream;
                    addLog("Camera matrix connected successfully.", "success");
                } catch (e) {
                    addLog("CRITICAL: Camera access denied.", "danger");
                    alert("Please allow camera permissions to start monitoring.");
                    throw e;
                }
            }
        }

        function stopCamera() {
            if (state.stream) {
                state.stream.getTracks().forEach(t => t.stop());
                state.stream = null;
                addLog("Camera matrix disconnected.");
            }
        }

        async function captureBurst() {
            if (!state.isMonitoring) return;
            
            const ctx = DOM.canvas.getContext('2d');
            DOM.canvas.width = DOM.video.videoWidth || 640;
            DOM.canvas.height = DOM.video.videoHeight || 480;

            addLog("Initiating interval capture sequence (3 frames)...");
            
            for (let i = 1; i <= 3; i++) {
                if (!state.isMonitoring) break;
                
                ctx.drawImage(DOM.video, 0, 0, DOM.canvas.width, DOM.canvas.height);
                const imageData = DOM.canvas.toDataURL('image/jpeg', 0.9);
                state.imagesCaptured++;
                
                addLog(`Frame ${i}/3 captured and queued for processing.`);

                // Send images to backend
                try {
                    await fetch('http://127.0.0.1:5000/process_interval', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ images: [imageData] }) // Sending one by one for simplicity in burst
                    });
                } catch(e) {
                    console.log("Error sending frame to backend", e);
                }

                if (i < 3) await new Promise(r => setTimeout(r, 800)); // 800ms between burst frames
            }
            
            addLog("Interval sequence complete. System standing by.", "success");
        }

        async function startSystem() {
            // Admin validation
            if (DOM.adminUser.value !== 'admin' || DOM.adminPass.value !== '123') {
                alert("Unauthorized Access. Valid credentials required.");
                addLog("Failed start attempt: Unauthorized.");
                return;
            }

            const hrs = parseFloat(DOM.totalTime.value);
            const mins = parseFloat(DOM.intervalTime.value);

            if (isNaN(hrs) || hrs <= 0) return alert("Invalid Total Duration");
            if (isNaN(mins) || mins <= 0) return alert("Invalid Capture Interval");

            try {
                await initCamera();
                
                state.isMonitoring = true;
                state.imagesCaptured = 0;

                // UI Updates
                DOM.startBtn.style.display = 'none';
                DOM.stopBtn.style.display = 'block';
                DOM.statusWidget.classList.add('active');
                DOM.consoleDot.style.background = 'var(--success)';
                
                DOM.statusText.textContent = "Monitoring Active";
                DOM.statusSubtext.textContent = `Capturing every ${mins} min for ${hrs} hr(s)`;

                [DOM.adminUser, DOM.adminPass, DOM.totalTime, DOM.intervalTime].forEach(el => el.disabled = true);

                addLog(`System Armed. Duration: ${hrs}h | Interval: ${mins}m`);

                // Initial capture
                captureBurst();

                // Setup loops
                const intervalMs = mins * 60 * 1000;
                const totalMs = hrs * 60 * 60 * 1000;

                state.mainInterval = setInterval(captureBurst, intervalMs);
                state.totalTimeout = setTimeout(() => {
                    addLog("Target duration reached. Auto-terminating sequence.", "success");
                    stopSystem();
                }, totalMs);

            } catch (err) {
                console.error(err);
            }
        }

        function stopSystem() {
            state.isMonitoring = false;
            clearInterval(state.mainInterval);
            clearTimeout(state.totalTimeout);
            stopCamera();

            DOM.startBtn.style.display = 'block';
            DOM.stopBtn.style.display = 'none';
            DOM.statusWidget.classList.remove('active');
            DOM.consoleDot.style.background = 'var(--text-muted)';
            
            DOM.statusText.textContent = "System Idle";
            DOM.statusSubtext.textContent = "Waiting for admin to initiate sequence";

            [DOM.adminUser, DOM.adminPass, DOM.totalTime, DOM.intervalTime].forEach(el => el.disabled = false);

            addLog("System Disarmed. Monitoring stopped.");
        }

        DOM.startBtn.addEventListener('click', startSystem);
        DOM.stopBtn.addEventListener('click', stopSystem);
    </script>
</body>
</html>
